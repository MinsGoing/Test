name: Build LocalSend Chat Camera arm64-v8a
on:
  push:
    branches:
      - chatgpt/localsend-camera-arm64-20261031

permissions:
  contents: read

concurrency:
  group: chat-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout LocalSend source
        run: git clone --depth 1 --branch chatgpt/localsend-chat-full-source-20261031 https://github.com/MinsGoing/Test.git localsend
      - name: Add camera capture to Android send picker
        if: false
        run: |
          cd localsend
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/lib/util/native/file_picker.dart")
          s=p.read_text()
          def change(old,new):
              global s
              if s.count(old)!=1:
                  raise RuntimeError("Upstream code changed: " + old[:80])
              s=s.replace(old,new,1)
          change("import 'package:flutter/services.dart';",
                 "import 'package:flutter/services.dart';\nimport 'package:image_picker/image_picker.dart';")
          change("  media(Icons.image),", "  media(Icons.image),\n  camera(Icons.photo_camera),")
          change("      case FilePickerOption.media:\n        return t.sendTab.picker.media;",
                 "      case FilePickerOption.media:\n        return t.sendTab.picker.media;\n      case FilePickerOption.camera:\n        return t.assetPicker.sActionUseCameraHint;")
          change("        FilePickerOption.media,\n        FilePickerOption.clipboard,",
                 "        FilePickerOption.media,\n        FilePickerOption.camera,\n        FilePickerOption.clipboard,")
          change("      case FilePickerOption.media:\n        // ignore: use_build_context_synchronously\n        await _pickMedia(context, ref);\n        break;",
                 "      case FilePickerOption.media:\n        // ignore: use_build_context_synchronously\n        await _pickMedia(context, ref);\n        break;\n      case FilePickerOption.camera:\n        // ignore: use_build_context_synchronously\n        await _pickCamera(context, ref);\n        break;")
          change("Future<void> _pickMedia(BuildContext context, Ref ref) async {",
          """Future<void> _pickCamera(BuildContext context, Ref ref) async {
            try {
              final photo = await ImagePicker().pickImage(source: ImageSource.camera);
              if (photo == null) return;

              await ref.redux(selectedSendingFilesProvider).dispatchAsync(
                AddFilesAction(
                  files: [photo],
                  converter: CrossFileConverters.convertXFile,
                ),
              );
            } catch (e, stackTrace) {
              _logger.warning('Failed to capture photo', e, stackTrace);
              if (context.mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  SnackBar(content: Text(t.general.error)),
                );
              }
            }
          }

          Future<void> _pickMedia(BuildContext context, Ref ref) async {""")
          p.write_text(s)
          PY
      - name: Add chat conversation screen
        if: false
        run: |
          cp localsend_chat/chat_send_page.dart localsend/chat_send_page.dart
          cp localsend_chat/apply_chat.py localsend/apply_chat.py
          cd localsend
          python3 apply_chat.py
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
      - name: Rust for Android arm64
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.97.1
      - name: Create personal build signing key
        run: |
          cd localsend/app/android/app
          keytool -genkeypair -noprompt -keystore camera-arm64.jks -alias camera-arm64 -storepass localcamera2026 -keypass localcamera2026 -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=LocalSend Camera Personal Build"
          cat > ../key.properties <<'EOF'
          storePassword=localcamera2026
          keyPassword=localcamera2026
          keyAlias=camera-arm64
          storeFile=camera-arm64.jks
          EOF
      - name: Install dependencies
        run: |
          cd localsend/app && flutter pub get
          cd ../packages/localsend_isolates/rust_builder/cargokit/build_tool && flutter pub get
      - name: Format chat code
        working-directory: localsend/app
        run: dart format lib/pages/chat_send_page.dart lib/pages/tabs/send_tab_vm.dart lib/provider/network/send_provider.dart lib/util/native/file_picker.dart
      - name: Analyze app
        working-directory: localsend/app
        run: flutter analyze --no-pub
      - name: Build arm64-v8a APK
        working-directory: localsend/app
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Copy build
        run: cp localsend/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk LocalSend-Chat-Camera-arm64-v8a.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalSend-Chat-Camera-arm64-v8a
          path: LocalSend-Chat-Camera-arm64-v8a.apk
          if-no-files-found: error
